<h1>DIRECTIVAS ESTRUCTURALES</h1>    
<h2>*ngFor: Mostrar una lista</h2>
<ul>
<li *ngFor="let fruta of frutas">{{ fruta }}</li>
</ul>


<h1>DIRECTIVAS DE ATRIBUTO</h1> 
<h2>[ngStyle]: Cambiar color del texto</h2>                              
<p [ngStyle]="{ 'color': textColor }">Este texto es de color azul</p>
