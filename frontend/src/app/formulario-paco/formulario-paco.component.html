<form (ngSubmit)="actualizarUsuario()">
 <!-- Botón para obtener todos los usuarios -->
<button type="button" class="btn btn-info m-2" (click)="obtenerTodosUsuarios()">Mostrar Todos los Usuarios</button>

<!-- Tabla de usuarios -->
<table *ngIf="usuarios.length > 0" class="table mt-4">
  <thead>
    <tr>
      <th>ID</th>
      <th>Nombre</th>
      <th>Apellido</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let usuario of usuarios">
      <td>{{ usuario.id }}</td>
      <td>{{ usuario.nombre }}</td>
      <td>{{ usuario.apellido }}</td>
    </tr>
  </tbody>
</table>

 
  <!-- ID de Usuario -->
  <div class="m-2">
    <label class="form-nombre">ID de Usuario:</label>
    <input type="text" class="form-control" placeholder="ID" [(ngModel)]="userId" name="userId" required>
  </div>

  <!-- Botón de Obtener Usuario -->
  <button type="button" class="btn btn-info m-2" (click)="obtenerUsuario()" [disabled]="!isUserIdValid()">Obtener Usuario</button><button type="button" class="btn btn-danger m-2" (click)="eliminarUsuario()" [disabled]="!isUserIdValid()">Eliminar Usuario</button>

  <!-- Campos del formulario -->
  <div class="m-2">
    <label class="form-nombre">Nombre:</label>
    <input type="text" class="form-control" placeholder="Nombre" [(ngModel)]="formData.nombre" name="nombre" required>
  </div>
  <div class="m-2">
    <label class="form-nombre">Apellido:</label>
    <input type="text" class="form-control" placeholder="Apellido" [(ngModel)]="formData.apellido" name="apellido" required>
  </div>
  <div class="m-2">
    <label class="form-nombre">Correo:</label>
    <input type="email" class="form-control" placeholder="Correo" [(ngModel)]="formData.correo" name="correo" required>
  </div>
  <div class="m-2">
    <label class="form-nombre">Contraseña:</label>
    <input type="password" class="form-control" placeholder="Contraseña" [(ngModel)]="formData.contrasena" name="contrasena" required>
  </div>
  <div class="m-2">
    <label class="form-nombre">Confirmar contraseña:</label>
    <input type="password" class="form-control" placeholder="Confirmar contraseña" [(ngModel)]="formData.confirmarContrasena" name="confirmarContrasena" required>
  </div>
  <div class="m-2">
    <label class="form-nombre">Dirección:</label>
    <input type="text" class="form-control" placeholder="Dirección" [(ngModel)]="formData.direccion" name="direccion" required>
  </div>
  <div class="m-2">
    <label class="form-nombre">Teléfono:</label>
    <input type="number" class="form-control" placeholder="Teléfono" [(ngModel)]="formData.telefono" name="telefono" required>
  </div>
  <div class="m-2">
    <label class="form-nombre">Fecha de nacimiento:</label>
    <input type="date" class="form-control" placeholder="Fecha de nacimiento" [(ngModel)]="formData.fechaNacimiento" name="fechaNacimiento" required>
  </div>
  <div class="m-2">
    <label class="form-nombre">Género:</label>
    <select class="form-control" [(ngModel)]="formData.genero" name="genero" required>
      <option value="masculino">Masculino</option>
      <option value="femenino">Femenino</option>
      <option value="otro">Otro</option>
    </select>
  </div>
  <div class="m-2">
    <label class="form-nombre">Estado civil:</label>
    <select class="form-control" [(ngModel)]="formData.estadoCivil" name="estadoCivil" required>
      <option value="soltero">Soltero</option>
      <option value="casado">Casado</option>
      <option value="divorciado">Divorciado</option>
      <option value="viudo">Viudo</option>
    </select>
  </div>

  <!-- Botón para Actualizar -->
  <button type="submit" class="btn btn-primary m-2" [disabled]="!isFormValid()">Actualizar</button>


</form>
