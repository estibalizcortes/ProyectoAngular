<div>
    <h1 class="form-title">Formulario de registro - Francisco Jose Fernández Álvarez</h1>
    <form [formGroup]="formulario" (ngSubmit)="enviarDatos()">
      <div class="m-2">
        <label class="form-nombre">Nombre:</label>
        <input type="text" class="form-control" placeholder="Nombre" formControlName="nombre" (mouseover)="changeColor($event)" (mouseout)="resetColor($event)" [ngStyle]="{color: color}">
      </div>
      <div class="m-2">
        <label class="form-nombre">Apellido:</label>
        <input type="text" class="form-control" placeholder="Apellido" formControlName="apellido" (mouseover)="changeColor($event)" (mouseout)="resetColor($event)" [ngStyle]="{color: color}">
      </div>
      <div class="m-2">
        <label class="form-nombre">Correo:</label>
        <input type="email" class="form-control" placeholder="Correo" formControlName="correo" (mouseover)="changeColor($event)" (mouseout)="resetColor($event)" [ngStyle]="{color: color}">
      </div>
      <div class="m-2">
        <label class="form-nombre">Contraseña:</label>
        <input type="password" class="form-control" placeholder="Contraseña" formControlName="contrasena" (mouseover)="changeColor($event)" (mouseout)="resetColor($event)" [ngStyle]="{color: color}">
      </div>
      <div class="m-2">
        <label class="form-nombre">Confirmar contraseña:</label>
        <input type="password" class="form-control" placeholder="Confirmar contraseña" formControlName="confirmarContrasena" (mouseover)="changeColor($event)" (mouseout)="resetColor($event)" [ngStyle]="{color: color}">
      </div>
      <div class="m-2">
        <label class="form-nombre">Dirección:</label>
        <input type="text" class="form-control" placeholder="Dirección" formControlName="direccion" (mouseover)="changeColor($event)" (mouseout)="resetColor($event)" [ngStyle]="{color: color}">
      </div>
      <div class="m-2">
        <label class="form-nombre">Teléfono:</label>
        <input type="number" class="form-control" placeholder="Teléfono" formControlName="telefono" (mouseover)="changeColor($event)" (mouseout)="resetColor($event)" [ngStyle]="{color: color}">
      </div>
      <div class="m-2">
        <label class="form-nombre">Fecha de nacimiento:</label>
        <input type="date" class="form-control" placeholder="Fecha de nacimiento" formControlName="fechaNacimiento" (mouseover)="changeColor($event)" (mouseout)="resetColor($event)" [ngStyle]="{color: color}">
      </div>
      <div class="m-2">
        <label class="form-nombre">Género:</label>
        <select class="form-control" formControlName="genero" (mouseover)="changeColor($event)" (mouseout)="resetColor($event)" [ngStyle]="{color: color}">
          <option value="masculino">Masculino</option>
          <option value="femenino">Femenino</option>
          <option value="otro">Otro</option>
        </select>
      </div>
      <div class="m-2">
        <label class="form-nombre">Estado civil:</label>
        <select class="form-control" formControlName="estadoCivil" (mouseover)="changeColor($event)" (mouseout)="resetColor($event)" [ngStyle]="{color: color}">
          <option value="soltero">Soltero</option>
          <option value="casado">Casado</option>
          <option value="divorciado">Divorciado</option>
          <option value="viudo">Viudo</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary m-2" 
        [disabled]="formulario.invalid" 
        (mouseover)="changeColor($event)" 
        (mouseout)="resetColor($event)" 
        [ngStyle]="{backgroundColor: color}">
  Enviar
</button>

    </form>

    <div class="m-3">
      <label class="form-label">ID de Usuario:</label>
      <input type="text" class="form-control" placeholder="ID" [(ngModel)]="userId" name="userId">
  </div>

  <button class="btn btn-danger m-2" (click)="eliminarUsuario()" [disabled]="!isUserIdValid()">Eliminar</button>
  </div>
